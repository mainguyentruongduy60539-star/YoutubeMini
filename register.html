<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Register - My Youtube 2026</title>
    <link href="assets/css/bootstrap.css" rel="stylesheet" />
    <link href="assets/css/owl.carousel.css" rel="stylesheet" />
    <link href="assets/css/owl.theme.default.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <link href="assets/css/style.css" rel="stylesheet" />
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-light mb-3 main-nav border-bottom shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img class="logo" src="assets/images/youtube-logo.png" alt="Logo" />
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 left-menu-top">
                    
                </ul>
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 right-menu-top">
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">
                            <i class="fa-solid fa-user-shield"></i>
                            Sign In
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container d-flex align-items-center justify-content-center" style="min-height: calc(100vh - 80px);">
        <div class="card shadow-sm auth-form border-0" style="max-width: 500px; width: 100%; border-radius: 1rem;">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <img src="assets/images/youtube-logo.png" alt="Logo" style="height: 40px; margin-bottom: 1rem;" />
                    <h4 class="fw-bold">Create an Account</h4>
                    <p class="text-muted">Join My Youtube 2026</p>
                </div>
                <form action="login.html">
                    <div class="row g-3">
                        <div class="col-sm-6 mb-3">
                            <label for="firstName" class="form-label fw-semibold">First Name</label>
                            <input type="text" class="form-control bg-light" id="firstName" placeholder="First Name"
                                required>
                        </div>
                        <div class="col-sm-6 mb-3">
                            <label for="lastName" class="form-label fw-semibold">Last Name</label>
                            <input type="text" class="form-control bg-light" id="lastName" placeholder="Last Name"
                                required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email address</label>
                        <input type="email" class="form-control bg-light" id="email" placeholder="name@example.com"
                            required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <input type="password" class="form-control bg-light" id="password"
                            placeholder="Create a password" required>
                    </div>
                    <div class="mb-4">
                        <label for="confirmPassword" class="form-label fw-semibold">Confirm Password</label>
                        <input type="password" class="form-control bg-light" id="confirmPassword"
                            placeholder="Confirm password" required>
                    </div>
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-semibold">Register</button>
                    </div>
                    <div class="text-center mt-3">
                        <span class="text-muted">Already have an account?</span>
                        <a href="login.html" class="text-decoration-none fw-semibold">Sign In</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <section id="scripts">
        <script src="assets/js/bootstrap.bundle.js"></script>
        <script src="assets/js/jquery.js"></script>
        <script src="assets/js/script.js"></script>
    </section>
</body>

</html>
